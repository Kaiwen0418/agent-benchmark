name: ${DATABASE_COMPOSE_PROJECT_NAME:-agentbench-database}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      AGENTBENCH_DATABASE_NAME: ${AGENTBENCH_DATABASE_NAME}
      AGENTBENCH_DATABASE_PASSWORD: ${AGENTBENCH_DATABASE_PASSWORD}
      AGENTBENCH_DATABASE_USER: ${AGENTBENCH_DATABASE_USER}
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-agentbench_admin}
    ports:
      - "127.0.0.1:${DATABASE_DIRECT_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-agentbench.sh:/docker-entrypoint-initdb.d/10-agentbench.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    environment:
      AUTH_TYPE: scram-sha-256
      DB_HOST: postgres
      DB_NAME: ${AGENTBENCH_DATABASE_NAME}
      DB_PASSWORD: ${AGENTBENCH_DATABASE_PASSWORD}
      DB_PORT: 5432
      DB_USER: ${AGENTBENCH_DATABASE_USER}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      POOL_MODE: transaction
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
    ports:
      - "${DATABASE_LISTEN_ADDRESS:-127.0.0.1}:${DATABASE_POOL_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U "$${DB_USER}" -d "$${DB_NAME}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:

map $uri $log_route {
  default app;
  /health health;
  /orchestrator health;
  /orchestrator/health health;
  ~^/(orchestrator/)?api/ api;
}
map $request_method $log_method {
  default OTHER;
  GET GET;
  POST POST;
  PUT PUT;
  PATCH PATCH;
  DELETE DELETE;
  HEAD HEAD;
  OPTIONS OPTIONS;
}
log_format agentbench_json escape=json
  '{"event":"http.request","service":"gateway","request_id":"$request_id",'
  '"method":"$log_method","route":"$log_route","status":$status,'
  '"duration_seconds":$request_time}';

server {
  access_log /dev/stdout agentbench_json;
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $hosted_orchestrator http://hosted-orchestrator:3004;
  set $hosted_sites http://hosted-sites:3003;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  location = /metrics { return 404; }
  location = /orchestrator/metrics { return 404; }

  location = /orchestrator {
    proxy_pass $hosted_orchestrator/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /orchestrator/ {
    rewrite ^/orchestrator/(.*)$ /$1 break;
    proxy_pass $hosted_orchestrator;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location / {
    proxy_pass $hosted_sites;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }
}
